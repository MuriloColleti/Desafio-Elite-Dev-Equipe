server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: rotas do react-router nao existem em disco, o index resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Evita CORS e tira a URL da api do bundle: o browser fala so com o nginx.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
  }
}

services:
  db:
    image: postgres:16-alpine
    container_name: estacionamento-db
    environment:
      POSTGRES_USER: estacionamento
      POSTGRES_PASSWORD: estacionamento
      POSTGRES_DB: estacionamento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estacionamento"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
